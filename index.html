<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>領地管理マップ - 獅子の如く</title>
<style>
  :root{
    --bg: #14181a;
    --panel: #1d2325;
    --panel-2: #242b2d;
    --line: #313a3c;
    --text: #e7e2d3;
    --text-dim: #9aa3a0;
    --accent: #b3462f;      /* 朱色 */
    --accent-2: #c9a24b;    /* 金 */
    --ok: #6ea56b;
    --warn: #d94f3a;
    --grid-line: #2a3234;
    --grid-line-major: #3a4547;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; width: 100vw; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 300px; min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: width .2s ease, min-width .2s ease, border-color .2s ease, transform .2s ease;
  }
  #sidebar.collapsed { width: 0; min-width: 0; border-right-color: transparent; }
  #sidebarToggle {
    position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 44px; border-radius: 5px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text-dim);
    cursor: pointer; z-index: 20; font-size: 11px; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  #sidebarToggle:hover { color: var(--text); border-color: var(--accent-2); }
  .brand {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 {
    margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .02em;
    color: var(--accent-2);
  }
  .brand p { margin: 4px 0 0; font-size: 11.5px; color: var(--text-dim); }

  .modes {
    display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .mode-btn {
    flex: 1; padding: 8px 4px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text-dim);
    cursor: pointer; text-align: center; transition: all .12s;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mode-btn:hover:not(.active) { border-color: var(--accent-2); color: var(--text); }

  #freeformToggleWrap {
    display: flex; align-items: center; gap: 6px; margin: 0 14px 12px;
    font-size: 11.5px; color: var(--text-dim); padding: 8px 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  #freeformToggleWrap input { width: 16px; height: 16px; flex-shrink: 0; }

  .section { padding: 12px 14px; border-bottom: 1px solid var(--line); overflow-y: auto; }
  .section h2 {
    font-size: 11px; text-transform: none; color: var(--text-dim);
    margin: 0 0 8px; font-weight: 600; letter-spacing: .03em;
  }

  .member-add { display: flex; gap: 6px; margin-bottom: 10px; }
  .member-add input[type=text] {
    flex: 1; min-width: 0; padding: 6px 8px; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; color: var(--text);
  }
  .member-add input[type=color] {
    width: 32px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer;
  }
  .member-add button {
    padding: 6px 10px; font-size: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 5px; cursor: pointer;
  }
  .member-add button:hover { opacity: .9; }

  #memberList { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

  .land-add { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  .land-add select {
    width: 100%; padding: 6px 8px; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; color: var(--text);
  }
  .coord-inputs { display: flex; align-items: center; gap: 4px; }
  .coord-inputs input {
    width: 0; flex: 1; min-width: 0; padding: 6px 4px; font-size: 12.5px; text-align: center;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .coord-inputs .sep { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .land-add button {
    padding: 7px 10px; font-size: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 5px; cursor: pointer;
  }
  .land-add button:hover { opacity: .9; }

  .snapshot-save-btn {
    width: 100%; padding: 7px 10px; font-size: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 5px; cursor: pointer; margin-bottom: 8px;
  }
  .snapshot-save-btn:hover { opacity: .9; }
  #snapshotList { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .snapshot-row {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
    background: var(--panel-2); font-size: 12px; color: var(--text-dim);
  }
  .snapshot-row .info { flex: 1; overflow: hidden; }
  .snapshot-row .sname { color: var(--text); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snapshot-row .sdate { font-size: 10px; color: var(--text-dim); }
  .snapshot-row .icon { cursor: pointer; padding: 3px 6px; font-size: 13px; border-radius: 4px; flex-shrink: 0; }
  .snapshot-row .load:hover { color: var(--ok); }
  .snapshot-row .rename:hover { color: var(--accent-2); }
  .snapshot-row .del:hover { color: var(--warn); }  .member-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid transparent; cursor: pointer; font-size: 13px;
  }
  .member-row.selected { border-color: var(--accent-2); background: #2c2419; }
  .swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
  .swatch-input {
    width: 18px; height: 18px; flex-shrink: 0; padding: 0; border: none; border-radius: 4px;
    background: none; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .swatch-input::-webkit-color-swatch-wrapper { padding: 0; border-radius: 4px; }
  .swatch-input::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
  .swatch-input::-moz-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
  .swatch-input:hover { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .member-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member-row .status { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .status.ok { color: var(--ok); }
  .status.warn { color: #fff; background: var(--warn); }
  .status.none { color: var(--text-dim); }
  .member-row .del, .member-row .rename, .member-row .clearpos {
    color: var(--text-dim); font-size: 14px; padding: 3px 6px; border-radius: 4px; opacity: .55; cursor: pointer;
  }
  .member-row:hover .del, .member-row:hover .rename, .member-row:hover .clearpos { opacity: 1; }
  .member-row .del:hover { color: var(--warn); }
  .member-row .rename:hover { color: var(--accent-2); }
  .member-row .clearpos:hover { color: var(--accent); }

  #landList { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .land-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    background: var(--panel-2); font-size: 12px; color: var(--text-dim);
  }
  .land-row .coord { font-variant-numeric: tabular-nums; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .land-row .del, .land-row .rename { cursor: pointer; padding: 3px 5px; font-size: 13px; }
  .land-row .del:hover { color: var(--warn); }
  .land-row .rename:hover { color: var(--accent-2); }

  .hint { font-size: 11.5px; color: var(--text-dim); line-height: 1.6; padding: 12px 14px; }
  .hint b { color: var(--accent-2); font-weight: 600; }

  .footer-actions {
    margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--line);
    display: flex; gap: 8px;
  }
  .footer-actions button {
    flex: 1; padding: 8px; font-size: 12px; border-radius: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  }
  .footer-actions button:hover { border-color: var(--accent-2); }

  /* ---------- Canvas area ---------- */
  #canvasWrap { position: relative; flex: 1; overflow: hidden; }
  canvas { display: block; background: var(--bg); cursor: grab; touch-action: none; }
  canvas.panning { cursor: grabbing; }
  canvas.mode-land { cursor: crosshair; }
  canvas.mode-place { cursor: cell; }
  canvas.mode-mark { cursor: not-allowed; }
  canvas.mode-memo { cursor: text; }

  #hud {
    position: absolute; top: 10px; left: 12px; font-size: 11.5px; color: var(--text-dim);
    background: rgba(20,24,26,.75); padding: 5px 10px; border-radius: 6px; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #zoomCtrl {
    position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px;
  }
  #zoomCtrl button {
    width: 40px; height: 40px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); font-size: 18px; cursor: pointer;
  }
  #zoomCtrl button:hover { border-color: var(--accent-2); }

  #assignBar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent-2); border-radius: 8px;
    padding: 8px 12px; font-size: 12.5px; display: none; align-items: center; gap: 10px;
    max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center;
  }
  #assignBar.show { display: flex; }
  #assignBar select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px 6px; font-size: 13px;
  }
  #assignBar button { padding: 7px 12px; border-radius: 5px; border: none; cursor: pointer; font-size: 13px; }
  #assignBar .confirm { background: var(--accent); color: #fff; }
  #assignBar .cancel { background: var(--panel-2); color: var(--text-dim); }

  /* ---------- スマホ向けレイアウト ---------- */
  #sidebarBackdrop { display: none; }
  @media (max-width: 720px) {
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%; z-index: 40;
      width: min(86vw, 320px); min-width: 0;
      box-shadow: 2px 0 16px rgba(0,0,0,.5);
      transform: translateX(0);
    }
    #sidebar.collapsed { width: min(86vw, 320px); transform: translateX(-100%); border-right-color: var(--line); }
    #sidebarToggle {
      left: 8px; width: 30px; height: 52px; font-size: 13px;
      transform: translateY(-50%);
    }
    #app { position: relative; }
    #sidebarBackdrop {
      display: block; position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 35;
      pointer-events: none; transition: background .2s ease;
    }
    #sidebarBackdrop.show { background: rgba(0,0,0,.5); pointer-events: auto; }
    .mode-btn { padding: 10px 4px; font-size: 12.5px; }
    #zoomCtrl button { width: 44px; height: 44px; font-size: 20px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar" class="collapsed">
    <div class="brand">
      <h1>領地管理マップ</h1>
      <p>一族の配置と割り当て地の可視化</p>
    </div>

    <div class="modes">
      <div class="mode-btn active" data-mode="view">表示</div>
      <div class="mode-btn" data-mode="land">土地作成</div>
      <div class="mode-btn" data-mode="place">配置</div>
      <div class="mode-btn" data-mode="mark">印</div>
      <div class="mode-btn" data-mode="memo">メモ</div>
    </div>

    <label id="freeformToggleWrap" style="display:none;">
      <input type="checkbox" id="freeformToggle">
      自由形状で1マスずつ追加/削除する（スマホの場合はこちらを使用）
    </label>

    <div class="section" style="border-bottom:none; padding-bottom:0;">
      <h2>メンバー</h2>
      <div class="member-add">
        <input type="text" id="memberName" placeholder="名前を入力">
        <input type="color" id="memberColor" value="#c9a24b">
        <button id="addMemberBtn">追加</button>
      </div>
      <div id="memberList"></div>
    </div>

    <div class="section">
      <h2>割り当て済みの土地</h2>
      <div class="land-add">
        <select id="landAddMember"></select>
        <div class="coord-inputs">
          <input type="number" id="landX1" placeholder="X1">
          <input type="number" id="landY1" placeholder="Y1">
          <span class="sep">〜</span>
          <input type="number" id="landX2" placeholder="X2">
          <input type="number" id="landY2" placeholder="Y2">
        </div>
        <button id="addLandBtn">土地を追加</button>
      </div>
      <div id="landList"></div>
    </div>

    <div class="section">
      <h2>メモ</h2>
      <div id="memoList"></div>
    </div>

    <div class="section">
      <h2>スナップショット保存</h2>
      <button id="saveSnapshotBtn" class="snapshot-save-btn">名前をつけて保存</button>
      <div id="snapshotList"></div>
    </div>

    <div class="hint" id="modeHint">
      メンバーを選択してから、<b>土地作成</b>モードでドラッグして矩形の土地を割り当てます。<b>配置</b>モードではマスをクリックして現在地を置きます。他メンバーの土地とは重ねられません。<b>Ctrl+Z</b>で元に戻せます。
    </div>

    <div class="footer-actions">
      <button id="exportBtn">JSON書き出し</button>
      <button id="importBtn">読み込み</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div class="footer-actions">
      <button id="exportGithubBtn">GitHub公開用に書き出す</button>
    </div>
  </div>

  <div id="sidebarBackdrop"></div>

  <div id="canvasWrap">
    <button id="sidebarToggle" title="パネルの表示/非表示">▶</button>
    <canvas id="mapCanvas"></canvas>
    <div id="hud">x: 0, y: 0</div>
    <div id="assignBar">
      <span>この土地を割り当てる:</span>
      <select id="assignSelect"></select>
      <button class="confirm" id="assignConfirm">割り当て</button>
      <button class="cancel" id="assignCancel">取消</button>
    </div>
    <div id="zoomCtrl">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="zoomReset">⌂</button>
    </div>
  </div>
</div>

<!-- GitHub公開用に書き出す際、ここにスナップショット等の初期データがJSONとして埋め込まれる -->
<script id="embedded-state" type="application/json">{}</script>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "shishi_land_management_v1";
  const CELL = 22; // world px per cell at scale=1

  // マップ全体の範囲（4隅座標）: X200-439, Y760-999
  const MAP_BOUNDS = { x1: 200, y1: 760, x2: 439, y2: 999 };

  // ---------------- State ----------------
  let state = {
    members: [],   // {id, name, color}
    lands: [],     // {id, memberId, x1, y1, x2, y2}  (inclusive cell coords, 矩形の土地)
    freeformCells: {}, // "x,y" -> memberId  (自由形状の土地セル)
    positions: {}, // memberId -> {x, y}
    markedCells: {}, // "x,y" -> true  (侵蝕マークなど、任意のマスに付ける✕印)
    memos: [],     // {id, x, y, text}  (自由に置けるメモ、1マスにつき1件)
    selectedMemberId: null,
    snapshots: [] // {id, name, savedAt, data:{members,lands,freeformCells,positions}}
  };

  // 指定した矩形範囲が、既存の土地(矩形・自由形状、所有者問わず)と重なるか判定
  function rectOverlapsAny(x1, y1, x2, y2) {
    for (const l of state.lands) {
      if (x1 <= l.x2 && x2 >= l.x1 && y1 <= l.y2 && y2 >= l.y1) return true;
    }
    for (const key in state.freeformCells) {
      const parts = key.split(",");
      const kx = parseInt(parts[0], 10), ky = parseInt(parts[1], 10);
      if (kx >= x1 && kx <= x2 && ky >= y1 && ky <= y2) return true;
    }
    return false;
  }

  // ---------------- Undo (Ctrl+Z) ----------------
  let history = [];
  const MAX_HISTORY = 50;
  function pushHistory() {
    history.push(JSON.stringify({
      members: state.members,
      lands: state.lands,
      freeformCells: state.freeformCells,
      positions: state.positions,
      markedCells: state.markedCells,
      memos: state.memos
    }));
    if (history.length > MAX_HISTORY) history.shift();
  }
  function undo() {
    if (history.length === 0) { flashHint("これ以上元に戻せません"); return; }
    const snap = JSON.parse(history.pop());
    state.members = snap.members;
    state.lands = snap.lands;
    state.freeformCells = snap.freeformCells;
    state.positions = snap.positions;
    state.markedCells = snap.markedCells || {};
    state.memos = snap.memos || [];
    if (state.selectedMemberId && !state.members.some(m => m.id === state.selectedMemberId)) {
      state.selectedMemberId = null;
    }
    save(); draw(); renderMemberList(); renderLandList(); renderMemoList();
  }
  window.addEventListener("keydown", (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    const isEditable = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
    if (isEditable) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      e.preventDefault();
      undo();
    }
  });

  function uid() { return Math.random().toString(36).slice(2, 10); }

  // ---------------- 保存/読み込み（共有ストレージ対応） ----------------
  // Claude上でこのファイルを開いている場合はwindow.storageを使い、全員が同じデータを見られるようにする。
  // window.storageが無い環境（ダウンロードして単体で開いた場合など）ではブラウザのlocalStorageにフォールバックする。
  const HAS_SHARED_STORAGE = typeof window.storage !== "undefined";

  async function loadState() {
    if (HAS_SHARED_STORAGE) {
      try {
        const res = await window.storage.get(STORAGE_KEY, true);
        if (res && res.value) return JSON.parse(res.value);
      } catch (e) { /* キーが無い場合はエラーになるので握りつぶす */ }
      return null;
    }
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 400);
  }
  async function doSave() {
    const payload = JSON.stringify({
      members: state.members,
      lands: state.lands,
      freeformCells: state.freeformCells,
      positions: state.positions,
      markedCells: state.markedCells,
      memos: state.memos,
      selectedMemberId: state.selectedMemberId,
      snapshots: state.snapshots
    });
    if (HAS_SHARED_STORAGE) {
      try { await window.storage.set(STORAGE_KEY, payload, true); }
      catch (e) { console.error("save failed", e); }
    } else {
      try { localStorage.setItem(STORAGE_KEY, payload); } catch (e) { /* ignore */ }
    }
  }

  // ---------------- サイドバー折りたたみ ----------------
  {
    const sidebarEl = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");
    const backdropEl = document.getElementById("sidebarBackdrop");
    let collapsed = true;
    function applyCollapsed() {
      sidebarEl.classList.toggle("collapsed", collapsed);
      toggleBtn.textContent = collapsed ? "▶" : "◀";
      backdropEl.classList.toggle("show", !collapsed);
      setTimeout(() => resizeCanvas(), 210);
    }
    toggleBtn.addEventListener("click", () => {
      collapsed = !collapsed;
      applyCollapsed();
    });
    backdropEl.addEventListener("click", () => {
      collapsed = true;
      applyCollapsed();
    });
    applyCollapsed(); // 初期状態を確実に「閉じた」状態にする
  }

  // ---------------- Canvas / viewport ----------------
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("canvasWrap");
  const hud = document.getElementById("hud");

  let view = { offsetX: 200, offsetY: 200, scale: 1 };
  let mode = "view";
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  // マップ回転: X439,Y760(北東の角)が南(画面下)に来るよう135°回転
  const MAP_ROTATION_DEG = 135;
  const MAP_ROTATION_RAD = MAP_ROTATION_DEG * Math.PI / 180;
  const ROT_COS = Math.cos(MAP_ROTATION_RAD);
  const ROT_SIN = Math.sin(MAP_ROTATION_RAD);
  const CENTER_WX = (MAP_BOUNDS.x1 + MAP_BOUNDS.x2 + 1) / 2 * CELL;
  const CENTER_WY = (MAP_BOUNDS.y1 + MAP_BOUNDS.y2 + 1) / 2 * CELL;

  // 指定セルの所有者を返す（矩形の土地・自由形状セルの両方を考慮）。境界線の一体化に使用。
  function cellOwner(x, y) {
    const key = x + "," + y;
    const fcOwner = state.freeformCells[key];
    if (fcOwner) return fcOwner;
    for (let i = 0; i < state.lands.length; i++) {
      const l = state.lands[i];
      if (x >= l.x1 && x <= l.x2 && y >= l.y1 && y <= l.y2) return l.memberId;
    }
    return undefined;
  }

  // 指定範囲のセル所有者マップを事前構築（角座標ラベル描画用、毎セルでcellOwnerを呼ぶより高速）
  function buildOwnerGrid(gx0, gy0, gx1, gy1) {
    const grid = {};
    state.lands.forEach(l => {
      const ix1 = Math.max(l.x1, gx0), iy1 = Math.max(l.y1, gy0);
      const ix2 = Math.min(l.x2, gx1), iy2 = Math.min(l.y2, gy1);
      if (ix1 > ix2 || iy1 > iy2) return;
      for (let cx = ix1; cx <= ix2; cx++) {
        for (let cy = iy1; cy <= iy2; cy++) {
          grid[cx + "," + cy] = l.memberId;
        }
      }
    });
    for (const key in state.freeformCells) {
      const parts = key.split(",");
      const kx = parseInt(parts[0], 10), ky = parseInt(parts[1], 10);
      if (kx < gx0 || kx > gx1 || ky < gy0 || ky > gy1) continue;
      grid[key] = state.freeformCells[key];
    }
    return grid;
  }

  function computeEffectiveBounds() {
    let x1 = MAP_BOUNDS.x1, y1 = MAP_BOUNDS.y1, x2 = MAP_BOUNDS.x2, y2 = MAP_BOUNDS.y2;
    state.lands.forEach(l => {
      x1 = Math.min(x1, l.x1); y1 = Math.min(y1, l.y1);
      x2 = Math.max(x2, l.x2); y2 = Math.max(y2, l.y2);
    });
    Object.keys(state.freeformCells).forEach(key => {
      const parts = key.split(",");
      const kx = parseInt(parts[0], 10), ky = parseInt(parts[1], 10);
      x1 = Math.min(x1, kx); y1 = Math.min(y1, ky);
      x2 = Math.max(x2, kx); y2 = Math.max(y2, ky);
    });
    return { x1, y1, x2, y2 };
  }

  function rotateFwd(dx, dy) {
    const r = { x: dx * ROT_COS - dy * ROT_SIN, y: dx * ROT_SIN + dy * ROT_COS };
    // 南北軸(y)を保ったまま東西(x)を反転
    return { x: -r.x, y: r.y };
  }
  function rotateInv(dx, dy) {
    const ux = -dx, uy = dy; // 東西反転を先に戻す
    return { x: ux * ROT_COS + uy * ROT_SIN, y: -ux * ROT_SIN + uy * ROT_COS };
  }

  let hasFitOnce = false;
  function resizeCanvas() {
    const r = wrap.getBoundingClientRect();
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    // スマホ等でレイアウト確定前(サイズ0)に呼ばれることがあるため、実際にサイズが取れるまで「合わせ済み」にしない
    if (!hasFitOnce && r.width > 0 && r.height > 0) {
      fitViewToBounds();
      hasFitOnce = true;
    }
    draw();
  }
  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 250));
  window.addEventListener("load", () => setTimeout(resizeCanvas, 50));
  // モバイルはアドレスバーの表示/非表示等でレイアウトが遅れて確定することがあるための保険
  setTimeout(resizeCanvas, 300);
  setTimeout(resizeCanvas, 800);

  function fitViewToBounds() {
    const cw = canvas.width / dpr, ch = canvas.height / dpr;
    if (cw === 0 || ch === 0) return;
    const b = computeEffectiveBounds();
    const corners = [
      [b.x1 * CELL, b.y1 * CELL],
      [(b.x2 + 1) * CELL, b.y1 * CELL],
      [b.x1 * CELL, (b.y2 + 1) * CELL],
      [(b.x2 + 1) * CELL, (b.y2 + 1) * CELL]
    ];
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    corners.forEach(([px, py]) => {
      const r = rotateFwd(px - CENTER_WX, py - CENTER_WY);
      minX = Math.min(minX, r.x); maxX = Math.max(maxX, r.x);
      minY = Math.min(minY, r.y); maxY = Math.max(maxY, r.y);
    });
    const boundsW = maxX - minX, boundsH = maxY - minY;
    const pad = 60; // 画面余白(px)、座標ラベル分の余裕
    const scaleX = (cw - pad * 2) / boundsW;
    const scaleY = (ch - pad * 2) / boundsH;
    view.scale = Math.min(8, Math.max(0.05, Math.min(scaleX, scaleY)));
    view.offsetX = cw / 2;
    view.offsetY = ch / 2;
  }

  function worldToScreen(wx, wy) {
    const dx = wx * CELL - CENTER_WX;
    const dy = wy * CELL - CENTER_WY;
    const r = rotateFwd(dx, dy);
    return { x: r.x * view.scale + view.offsetX, y: r.y * view.scale + view.offsetY };
  }
  function screenToWorldCell(sx, sy) {
    const rx = (sx - view.offsetX) / view.scale;
    const ry = (sy - view.offsetY) / view.scale;
    const u = rotateInv(rx, ry);
    const wx = (u.x + CENTER_WX) / CELL;
    const wy = (u.y + CENTER_WY) / CELL;
    return { x: Math.floor(wx), y: Math.floor(wy) };
  }

  // 世界座標の矩形(x1,y1)-(x2+1,y2+1)を回転を考慮した四角形として描画
  function drawWorldRect(x1, y1, x2, y2, opts) {
    const pts = [
      worldToScreen(x1, y1),
      worldToScreen(x2, y1),
      worldToScreen(x2, y2),
      worldToScreen(x1, y2)
    ];
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    if (opts.dash) ctx.setLineDash(opts.dash);
    if (opts.fill) { ctx.fillStyle = opts.fill; ctx.fill(); }
    if (opts.stroke) { ctx.strokeStyle = opts.stroke; ctx.lineWidth = opts.lineWidth || 1; ctx.stroke(); }
    if (opts.dash) ctx.setLineDash([]);
    return pts;
  }

  // ---------------- Drawing ----------------
  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cw = canvas.width / dpr, ch = canvas.height / dpr;
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = "#14181a";
    ctx.fillRect(0, 0, cw, ch);

    const cellPx = CELL * view.scale;

    // visible cell range (virtualization: only compute/draw what's on screen)
    // 回転(+反転)の向きによっては画面の「左上→右下」が世界座標の「最小→最大」と対応しない場合があるため、
    // 画面4隅すべてから世界座標を求めてmin/maxを取る。
    const cTL = screenToWorldCell(0, 0);
    const cTR = screenToWorldCell(cw, 0);
    const cBL = screenToWorldCell(0, ch);
    const cBR = screenToWorldCell(cw, ch);
    const cornerXs = [cTL.x, cTR.x, cBL.x, cBR.x];
    const cornerYs = [cTL.y, cTR.y, cBL.y, cBR.y];
    const x0 = Math.min.apply(null, cornerXs) - 1, x1 = Math.max.apply(null, cornerXs) + 1;
    const y0 = Math.min.apply(null, cornerYs) - 1, y1 = Math.max.apply(null, cornerYs) + 1;

    // grid lines only if cells are big enough to be legible (回転を考慮し、各線をワールド座標の両端から描画)
    // 背景マスは「大枠(実効範囲)の内側」だけに制限し、その範囲内は画面に映っている分をすべて描画する
    const gridBounds = computeEffectiveBounds();
    const gx0 = Math.max(x0, gridBounds.x1), gx1 = Math.min(x1, gridBounds.x2 + 1);
    const gy0 = Math.max(y0, gridBounds.y1), gy1 = Math.min(y1, gridBounds.y2 + 1);
    if (cellPx > 3 && gx0 <= gx1 && gy0 <= gy1) {
      ctx.lineWidth = 1;
      for (let gx = gx0; gx <= gx1; gx++) {
        const a = worldToScreen(gx, gy0), b = worldToScreen(gx, gy1);
        ctx.strokeStyle = (gx % 10 === 0) ? "#3a4547" : "#2a3234";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      for (let gy = gy0; gy <= gy1; gy++) {
        const a = worldToScreen(gx0, gy), b = worldToScreen(gx1, gy);
        ctx.strokeStyle = (gy % 10 === 0) ? "#3a4547" : "#2a3234";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }

    // マップ全体の範囲枠（後から追加した土地も含めて自動拡張）
    {
      const b = computeEffectiveBounds();
      const pts = drawWorldRect(b.x1, b.y1, b.x2 + 1, b.y2 + 1, { stroke: "#c9a24b", lineWidth: 3 });

      ctx.font = "bold 11px sans-serif";
      const corners = [
        { x: b.x1, y: b.y1, pt: pts[0] },
        { x: b.x2, y: b.y1, pt: pts[1] },
        { x: b.x2, y: b.y2, pt: pts[2] },
        { x: b.x1, y: b.y2, pt: pts[3] }
      ];
      corners.forEach(c => {
        const label = `X${c.x}, Y${c.y}`;
        ctx.textAlign = "center";
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = "rgba(20,24,26,.85)";
        ctx.fillRect(c.pt.x - tw / 2 - 2, c.pt.y - 16, tw + 4, 13);
        ctx.fillStyle = "#c9a24b";
        ctx.fillText(label, c.pt.x, c.pt.y - 6);
      });
    }

    // lands
    const memberById = {};
    state.members.forEach(m => memberById[m.id] = m);

    state.lands.forEach(land => {
      const m = memberById[land.memberId];
      if (!m) return;
      const p1 = worldToScreen(land.x1, land.y1);
      const p2 = worldToScreen(land.x2 + 1, land.y1);
      const p3 = worldToScreen(land.x2 + 1, land.y2 + 1);
      const p4 = worldToScreen(land.x1, land.y2 + 1);
      // culling (回転後のバウンディングボックスで判定)
      const allX = [p1.x, p2.x, p3.x, p4.x], allY = [p1.y, p2.y, p3.y, p4.y];
      const bMinX = Math.min(...allX), bMaxX = Math.max(...allX);
      const bMinY = Math.min(...allY), bMaxY = Math.max(...allY);
      if (bMaxX < 0 || bMaxY < 0 || bMinX > cw || bMinY > ch) return;

      const centerPt = { x: (bMinX + bMaxX) / 2, y: (bMinY + bMaxY) / 2 };

      drawWorldRect(land.x1, land.y1, land.x2 + 1, land.y2 + 1, { fill: m.color + "33" });

      // 境界線: 隣のセルが別所有者/未所有の辺だけ描画（自由形状セルと接する部分はつなぎ目なく合体させる）
      ctx.strokeStyle = m.color;
      ctx.lineWidth = 2;
      for (let gx = land.x1; gx <= land.x2; gx++) {
        if (cellOwner(gx, land.y1 - 1) !== land.memberId) {
          const a = worldToScreen(gx, land.y1), b = worldToScreen(gx + 1, land.y1);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        if (cellOwner(gx, land.y2 + 1) !== land.memberId) {
          const a = worldToScreen(gx, land.y2 + 1), b = worldToScreen(gx + 1, land.y2 + 1);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      for (let gy = land.y1; gy <= land.y2; gy++) {
        if (cellOwner(land.x1 - 1, gy) !== land.memberId) {
          const a = worldToScreen(land.x1, gy), b = worldToScreen(land.x1, gy + 1);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        if (cellOwner(land.x2 + 1, gy) !== land.memberId) {
          const a = worldToScreen(land.x2 + 1, gy), b = worldToScreen(land.x2 + 1, gy + 1);
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }

    });

    // 自由形状の土地セル
    {
      const fc = state.freeformCells;
      for (let gx = x0; gx <= x1; gx++) {
        for (let gy = y0; gy <= y1; gy++) {
          const key = gx + "," + gy;
          const ownerId = fc[key];
          if (!ownerId) continue;
          const m = memberById[ownerId];
          if (!m) continue;
          const p1 = worldToScreen(gx, gy);
          const p2 = worldToScreen(gx + 1, gy);
          const p3 = worldToScreen(gx + 1, gy + 1);
          const p4 = worldToScreen(gx, gy + 1);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
          ctx.closePath();
          ctx.fillStyle = m.color + "40";
          ctx.fill();

          // 隣接セルが別所有者/未所有なら境界線として描画（矩形の土地とも一体化させる）
          ctx.strokeStyle = m.color;
          ctx.lineWidth = 2;
          const edges = [
            { nx: gx, ny: gy - 1, a: p1, b: p2 },
            { nx: gx, ny: gy + 1, a: p4, b: p3 },
            { nx: gx - 1, ny: gy, a: p1, b: p4 },
            { nx: gx + 1, ny: gy, a: p2, b: p3 }
          ];
          edges.forEach(edge => {
            if (cellOwner(edge.nx, edge.ny) !== ownerId) {
              ctx.beginPath(); ctx.moveTo(edge.a.x, edge.a.y); ctx.lineTo(edge.b.x, edge.b.y); ctx.stroke();
            }
          });
        }
      }
    }

    // 土地の輪郭上の全ての角(頂点)に座標ラベルを表示（矩形・自由形状どちらも対象、境界が合体した場所は角として扱わない）
    // コマの座標が表示される大きさ(cellPx > 8)と同じ閾値にする
    if (cellPx > 8) {
      const grid = buildOwnerGrid(x0 - 1, y0 - 1, x1 + 1, y1 + 1);
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      for (let vx = x0; vx <= x1 + 1; vx++) {
        for (let vy = y0; vy <= y1 + 1; vy++) {
          const tl = grid[(vx - 1) + "," + (vy - 1)];
          const tr = grid[vx + "," + (vy - 1)];
          const bl = grid[(vx - 1) + "," + vy];
          const br = grid[vx + "," + vy];
          const owners = [];
          [tl, tr, bl, br].forEach(o => { if (o && owners.indexOf(o) === -1) owners.push(o); });
          if (owners.length === 0) continue;

          const pt = worldToScreen(vx, vy);
          if (pt.x < -20 || pt.y < -20 || pt.x > cw + 20 || pt.y > ch + 20) continue;

          let stack = 0;
          owners.forEach(ownerId => {
            const a = tl === ownerId, b = tr === ownerId, c = bl === ownerId, d = br === ownerId;
            const count = (a ? 1 : 0) + (b ? 1 : 0) + (c ? 1 : 0) + (d ? 1 : 0);
            const isDiagonal = (a && d && !b && !c) || (b && c && !a && !d);
            const isCorner = count === 1 || count === 3 || isDiagonal;
            if (!isCorner) return;
            const m = memberById[ownerId];
            if (!m) return;

            // 表示する座標は「頂点の通し番号」ではなく、その角を構成するマス自身の座標
            let cellCoord;
            if (count === 1) {
              if (a) cellCoord = { x: vx - 1, y: vy - 1 };
              else if (b) cellCoord = { x: vx, y: vy - 1 };
              else if (c) cellCoord = { x: vx - 1, y: vy };
              else cellCoord = { x: vx, y: vy };
            } else if (count === 3) {
              if (!a) cellCoord = { x: vx, y: vy };         // 欠けているのがTL→対角のBRを採用
              else if (!d) cellCoord = { x: vx - 1, y: vy - 1 }; // 欠けているのがBR→対角のTLを採用
              else if (!b) cellCoord = { x: vx - 1, y: vy };     // 欠けているのがTR→対角のBLを採用
              else cellCoord = { x: vx, y: vy - 1 };             // 欠けているのがBL→対角のTRを採用
            } else { // isDiagonal (鞍点)
              cellCoord = a ? { x: vx - 1, y: vy - 1 } : { x: vx, y: vy - 1 };
            }

            // ラベルは基本的にそのマス(セル)の中心付近だが、頂点方向へ少しずらす。
            // (1マスの土地などでは中心がコマの表示位置と重なり、後から描かれるコマのラベルに隠れてしまうため)
            const cellCenterWX = cellCoord.x + 0.5, cellCenterWY = cellCoord.y + 0.5;
            const t = 0.32;
            const labelWX = cellCenterWX + (vx - cellCenterWX) * t;
            const labelWY = cellCenterWY + (vy - cellCenterWY) * t;
            const cellCenter = worldToScreen(labelWX, labelWY);
            const lx = cellCenter.x, ly = cellCenter.y;

            const label = cellCoord.x + "," + cellCoord.y;
            const tw = ctx.measureText(label).width;
            ctx.fillStyle = "rgba(20,24,26,.8)";
            ctx.fillRect(lx - tw / 2 - 2, ly - 6, tw + 4, 11);
            ctx.fillStyle = m.color;
            ctx.fillText(label, lx, ly + 3);
            stack++;
          });
        }
      }
    }

    // 侵蝕マーク（✕印）
    {
      ctx.strokeStyle = "#ff4d4d";
      ctx.lineWidth = Math.max(1.5, Math.min(3, cellPx * 0.09));
      for (let gx = x0; gx <= x1; gx++) {
        for (let gy = y0; gy <= y1; gy++) {
          const key = gx + "," + gy;
          if (!state.markedCells[key]) continue;
          const p1 = worldToScreen(gx, gy);
          const p2 = worldToScreen(gx + 1, gy);
          const p3 = worldToScreen(gx + 1, gy + 1);
          const p4 = worldToScreen(gx, gy + 1);
          const inset = 0.18;
          const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
          const a1 = lerp(p1, p3, inset), a2 = lerp(p1, p3, 1 - inset);
          const b1 = lerp(p2, p4, inset), b2 = lerp(p2, p4, 1 - inset);
          ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
        }
      }
    }

    // drag-select preview (land creation)
    if (dragSelect) {
      const x1 = Math.min(dragSelect.x0, dragSelect.x1);
      const y1 = Math.min(dragSelect.y0, dragSelect.y1);
      const x2 = Math.max(dragSelect.x0, dragSelect.x1);
      const y2 = Math.max(dragSelect.y0, dragSelect.y1);
      drawWorldRect(x1, y1, x2 + 1, y2 + 1, { fill: "#c9a24b33", stroke: "#c9a24b", lineWidth: 1, dash: [4, 3] });
    }

    // members (pins)
    state.members.forEach(m => {
      const pos = state.positions[m.id];
      if (!pos) return;
      const center = worldToScreen(pos.x + 0.5, pos.y + 0.5);
      if (center.x < -20 || center.y < -20 || center.x > cw + 20 || center.y > ch + 20) return;

      const outside = isOutsideOwnLand(m.id);
      const r = Math.max(5, Math.min(9, cellPx * 0.32));

      if (outside) {
        ctx.beginPath();
        ctx.arc(center.x, center.y, r + 4, 0, Math.PI * 2);
        ctx.strokeStyle = "#d94f3a";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
      ctx.fillStyle = m.color;
      ctx.fill();
      ctx.strokeStyle = "#14181a";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (cellPx > 8) {
        ctx.textAlign = "center";
        ctx.font = "bold 10px sans-serif";
        const nameLabel = m.name;
        let tw = ctx.measureText(nameLabel).width;
        ctx.fillStyle = "rgba(20,24,26,.8)";
        ctx.fillRect(center.x - tw / 2 - 3, center.y - r - 17, tw + 6, 13);
        ctx.fillStyle = "#e7e2d3";
        ctx.fillText(nameLabel, center.x, center.y - r - 7);

        const coordLabel = `(${pos.x}, ${pos.y})`;
        ctx.font = "9px sans-serif";
        tw = ctx.measureText(coordLabel).width;
        ctx.fillStyle = "rgba(20,24,26,.8)";
        ctx.fillRect(center.x - tw / 2 - 3, center.y + r + 4, tw + 6, 12);
        ctx.fillStyle = "#c9a24b";
        ctx.fillText(coordLabel, center.x, center.y + r + 13);
      }
    });

    // メモ
    (state.memos || []).forEach(memo => {
      const center = worldToScreen(memo.x + 0.5, memo.y + 0.5);
      if (center.x < -30 || center.y < -30 || center.x > cw + 30 || center.y > ch + 30) return;
      const r = Math.max(6, Math.min(10, cellPx * 0.34));

      ctx.beginPath();
      ctx.arc(center.x, center.y, r, 0, Math.PI * 2);
      ctx.fillStyle = "#c9a24b";
      ctx.fill();
      ctx.strokeStyle = "#14181a";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${Math.max(8, Math.min(11, r * 1.1))}px sans-serif`;
      ctx.fillStyle = "#14181a";
      ctx.fillText("M", center.x, center.y + 0.5);
      ctx.textBaseline = "alphabetic";

      if (cellPx > 10) {
        const preview = memo.text.length > 14 ? memo.text.slice(0, 14) + "…" : memo.text;
        ctx.font = "10px sans-serif";
        const tw = ctx.measureText(preview).width;
        ctx.fillStyle = "rgba(20,24,26,.85)";
        ctx.fillRect(center.x - tw / 2 - 3, center.y + r + 4, tw + 6, 13);
        ctx.fillStyle = "#e7e2d3";
        ctx.fillText(preview, center.x, center.y + r + 13);
      }
    });

    ctx.restore();
  }

  function isOutsideOwnLand(memberId) {
    const pos = state.positions[memberId];
    if (!pos) return false;
    const ownLands = state.lands.filter(l => l.memberId === memberId);
    const key = `${pos.x},${pos.y}`;
    const ownsFreeformHere = state.freeformCells[key] === memberId;
    const hasAnyFreeform = Object.values(state.freeformCells).includes(memberId);
    if (ownLands.length === 0 && !hasAnyFreeform) return false; // 土地未割当なら警告なし
    const insideRect = ownLands.some(l => pos.x >= l.x1 && pos.x <= l.x2 && pos.y >= l.y1 && pos.y <= l.y2);
    return !(insideRect || ownsFreeformHere);
  }

  // ---------------- Interaction ----------------
  let isPanning = false, panStart = null, viewStart = null;
  let dragSelect = null; // {x0,y0,x1,y1} in cell coords, land-creation drag
  let pendingLandRect = null;
  let freeformPaint = null; // {action:'add'|'remove', memberId}
  let markPaint = null; // {action:'add'|'remove'}

  function applyFreeformPaint(x, y) {
    const key = x + "," + y;
    if (freeformPaint.action === "add") {
      const existingOwner = cellOwner(x, y);
      if (existingOwner && existingOwner !== freeformPaint.memberId) {
        if (!freeformPaint.warned) { flashHint("他のメンバーの土地には設置できません"); freeformPaint.warned = true; }
        return;
      }
      state.freeformCells[key] = freeformPaint.memberId;
    } else if (state.freeformCells[key] === freeformPaint.memberId) {
      delete state.freeformCells[key];
    }
  }

  function applyMarkPaint(x, y) {
    const key = x + "," + y;
    if (markPaint.action === "add") {
      state.markedCells[key] = true;
    } else {
      delete state.markedCells[key];
    }
  }

  function isFreeformIntent(shiftKey) {
    const toggle = document.getElementById("freeformToggle");
    return shiftKey || (toggle && toggle.checked);
  }

  function handlePointerDown(clientX, clientY, shiftKey) {
    const rect = canvas.getBoundingClientRect();
    const sx = clientX - rect.left, sy = clientY - rect.top;

    if (mode === "land") {
      const c = screenToWorldCell(sx, sy);
      if (isFreeformIntent(shiftKey)) {
        if (!state.selectedMemberId) { flashHint("先にメンバーを選択してください"); return; }
        const key = c.x + "," + c.y;
        const alreadyOwned = state.freeformCells[key] === state.selectedMemberId;
        pushHistory();
        freeformPaint = { action: alreadyOwned ? "remove" : "add", memberId: state.selectedMemberId };
        applyFreeformPaint(c.x, c.y);
        draw();
        return;
      }
      dragSelect = { x0: c.x, y0: c.y, x1: c.x, y1: c.y };
      return;
    }
    if (mode === "place") {
      if (!state.selectedMemberId) { flashHint("先にメンバーを選択してください"); return; }
      const c = screenToWorldCell(sx, sy);
      pushHistory();
      state.positions[state.selectedMemberId] = { x: c.x, y: c.y };
      save(); draw(); renderMemberList();
      return;
    }
    if (mode === "mark") {
      const c = screenToWorldCell(sx, sy);
      const key = c.x + "," + c.y;
      const alreadyMarked = !!state.markedCells[key];
      pushHistory();
      markPaint = { action: alreadyMarked ? "remove" : "add" };
      applyMarkPaint(c.x, c.y);
      save(); draw();
      return;
    }
    if (mode === "memo") {
      const c = screenToWorldCell(sx, sy);
      const existing = (state.memos || []).find(mm => mm.x === c.x && mm.y === c.y);
      if (existing) {
        const newText = prompt("メモを編集します（空にしてOKで削除）", existing.text);
        if (newText === null) return;
        const trimmed = newText.trim();
        pushHistory();
        if (!trimmed) {
          state.memos = state.memos.filter(mm => mm.id !== existing.id);
        } else {
          existing.text = trimmed;
        }
        save(); draw(); renderMemoList();
      } else {
        const text = prompt("このマスにメモを追加します。内容を入力してください:");
        if (text === null) return;
        const trimmed = text.trim();
        if (!trimmed) return;
        pushHistory();
        if (!state.memos) state.memos = [];
        state.memos.push({ id: uid(), x: c.x, y: c.y, text: trimmed });
        save(); draw(); renderMemoList();
      }
      return;
    }
    // pan (view mode)
    isPanning = true;
    panStart = { x: clientX, y: clientY };
    viewStart = { x: view.offsetX, y: view.offsetY };
    canvas.classList.add("panning");
  }

  function handlePointerMove(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const sx = clientX - rect.left, sy = clientY - rect.top;
    const c = screenToWorldCell(sx, sy);
    hud.textContent = `x: ${c.x}, y: ${c.y}`;

    if (dragSelect) {
      dragSelect.x1 = c.x; dragSelect.y1 = c.y;
      draw();
      return;
    }
    if (freeformPaint) {
      applyFreeformPaint(c.x, c.y);
      draw();
      return;
    }
    if (markPaint) {
      applyMarkPaint(c.x, c.y);
      draw();
      return;
    }
    if (isPanning) {
      view.offsetX = viewStart.x + (clientX - panStart.x);
      view.offsetY = viewStart.y + (clientY - panStart.y);
      draw();
    }
  }

  function handlePointerUp() {
    if (isPanning) { isPanning = false; canvas.classList.remove("panning"); }
    if (freeformPaint) {
      freeformPaint = null;
      save(); draw(); renderLandList(); renderMemberList();
    }
    if (markPaint) {
      markPaint = null;
      save(); draw();
    }
    if (dragSelect) {
      finalizeDragSelect();
    }
  }

  function finalizeDragSelect() {
    const x1 = Math.min(dragSelect.x0, dragSelect.x1);
    const y1 = Math.min(dragSelect.y0, dragSelect.y1);
    const x2 = Math.max(dragSelect.x0, dragSelect.x1);
    const y2 = Math.max(dragSelect.y0, dragSelect.y1);
    dragSelect = null;
    pendingLandRect = { x1, y1, x2, y2 };
    openAssignBar();
    draw();
  }

  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0 && e.button !== undefined) {
      // 中/右ボタンドラッグはパンとして扱う
      isPanning = true;
      panStart = { x: e.clientX, y: e.clientY };
      viewStart = { x: view.offsetX, y: view.offsetY };
      canvas.classList.add("panning");
      return;
    }
    handlePointerDown(e.clientX, e.clientY, e.shiftKey);
  });

  window.addEventListener("mousemove", (e) => {
    handlePointerMove(e.clientX, e.clientY);
  });

  window.addEventListener("mouseup", () => {
    handlePointerUp();
  });

  // ---------------- タッチ操作（スマホ・タブレット対応） ----------------
  let pinch = null; // {startDist, startScale, midX, midY}

  function touchDist(t0, t1) {
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }
  function touchMid(t0, t1, rect) {
    return { x: (t0.clientX + t1.clientX) / 2 - rect.left, y: (t0.clientY + t1.clientY) / 2 - rect.top };
  }

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      // ピンチズーム開始（進行中の単指操作はキャンセル）
      isPanning = false; dragSelect = null; freeformPaint = null; markPaint = null;
      canvas.classList.remove("panning");
      const rect = canvas.getBoundingClientRect();
      pinch = {
        startDist: touchDist(e.touches[0], e.touches[1]),
        startScale: view.scale,
        mid: touchMid(e.touches[0], e.touches[1], rect)
      };
      return;
    }
    if (e.touches.length === 1) {
      const t = e.touches[0];
      handlePointerDown(t.clientX, t.clientY, false);
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 2 && pinch) {
      const dist = touchDist(e.touches[0], e.touches[1]);
      const factor = dist / pinch.startDist;
      const newScale = Math.min(8, Math.max(0.05, pinch.startScale * factor));
      const worldBefore = { x: (pinch.mid.x - view.offsetX) / view.scale, y: (pinch.mid.y - view.offsetY) / view.scale };
      view.scale = newScale;
      view.offsetX = pinch.mid.x - worldBefore.x * view.scale;
      view.offsetY = pinch.mid.y - worldBefore.y * view.scale;
      draw();
      return;
    }
    if (e.touches.length === 1) {
      const t = e.touches[0];
      handlePointerMove(t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener("touchend", (e) => {
    e.preventDefault();
    if (e.touches.length === 0) {
      pinch = null;
      handlePointerUp();
    }
  }, { passive: false });
  canvas.addEventListener("touchcancel", (e) => {
    pinch = null;
    isPanning = false; dragSelect = null; freeformPaint = null; markPaint = null;
    canvas.classList.remove("panning");
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const worldBefore = { x: (sx - view.offsetX) / view.scale, y: (sy - view.offsetY) / view.scale };
    const factor = e.deltaY > 0 ? 0.88 : 1.12;
    view.scale = Math.min(8, Math.max(0.05, view.scale * factor));
    view.offsetX = sx - worldBefore.x * view.scale;
    view.offsetY = sy - worldBefore.y * view.scale;
    draw();
  }, { passive: false });

  document.getElementById("zoomIn").onclick = () => zoomStep(1.2);
  document.getElementById("zoomOut").onclick = () => zoomStep(0.83);
  document.getElementById("zoomReset").onclick = () => { fitViewToBounds(); draw(); };
  function zoomStep(f) {
    const cw = canvas.width / dpr, ch = canvas.height / dpr;
    const worldBefore = { x: (cw/2 - view.offsetX) / view.scale, y: (ch/2 - view.offsetY) / view.scale };
    view.scale = Math.min(8, Math.max(0.05, view.scale * f));
    view.offsetX = cw/2 - worldBefore.x * view.scale;
    view.offsetY = ch/2 - worldBefore.y * view.scale;
    draw();
  }

  // ---------------- Assign bar (land creation confirm) ----------------
  const assignBar = document.getElementById("assignBar");
  const assignSelect = document.getElementById("assignSelect");

  function openAssignBar() {
    assignSelect.innerHTML = "";
    state.members.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id; opt.textContent = m.name;
      if (m.id === state.selectedMemberId) opt.selected = true;
      assignSelect.appendChild(opt);
    });
    if (state.members.length === 0) {
      flashHint("先にメンバーを追加してください");
      pendingLandRect = null;
      return;
    }
    assignBar.classList.add("show");
  }
  document.getElementById("assignConfirm").onclick = () => {
    if (!pendingLandRect || !assignSelect.value) return;
    const memberId = assignSelect.value;
    const { x1, y1, x2, y2 } = pendingLandRect;
    if (rectOverlapsAny(x1, y1, x2, y2)) {
      flashHint("既存の土地と重なっています");
      pendingLandRect = null;
      assignBar.classList.remove("show");
      draw();
      return;
    }
    pushHistory();
    state.lands.push(Object.assign({ id: uid(), memberId }, pendingLandRect));
    pendingLandRect = null;
    assignBar.classList.remove("show");
    save(); draw(); renderLandList(); renderMemberList();
  };
  document.getElementById("assignCancel").onclick = () => {
    pendingLandRect = null;
    assignBar.classList.remove("show");
    draw();
  };

  // ---------------- Mode switching ----------------
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.dataset.mode;
      canvas.classList.remove("mode-land", "mode-place", "mode-mark", "mode-memo");
      if (mode === "land") canvas.classList.add("mode-land");
      if (mode === "place") canvas.classList.add("mode-place");
      if (mode === "mark") canvas.classList.add("mode-mark");
      if (mode === "memo") canvas.classList.add("mode-memo");
      updateHint();
    });
  });
  function updateHint() {
    const hint = document.getElementById("modeHint");
    const freeformWrap = document.getElementById("freeformToggleWrap");
    if (freeformWrap) freeformWrap.style.display = (mode === "land") ? "flex" : "none";
    if (mode === "land") hint.innerHTML = "地図上をドラッグ（スマホは指でなぞる）して矩形の土地を割り当てます。<b>Shift+クリック</b>、またはチェックボックスをONにして操作すると、マス目を1つずつ追加/削除して自由形状の土地を作れます。";
    else if (mode === "place") hint.innerHTML = "サイドバーでメンバーを選択し、地図上のマスをタップ/クリックして現在地を配置します。";
    else if (mode === "mark") hint.innerHTML = "地図上のマスをタップ/クリック（なぞって複数可）すると✕印を付けられます。もう一度同じ操作で消えます。侵蝕箇所の記録などに使えます。";
    else if (mode === "memo") hint.innerHTML = "地図上のマスをタップ/クリックしてメモを追加します（1マスに1件）。既にメモがあるマスをタップすると編集・削除できます。";
    else hint.innerHTML = "指でなぞる/ドラッグで地図を移動、ピンチ操作/ホイールでズームできます。<b>土地作成</b> / <b>配置</b> / <b>印</b> / <b>メモ</b>モードで編集します。";
  }
  function flashHint(msg) {
    const hint = document.getElementById("modeHint");
    const old = hint.innerHTML;
    hint.innerHTML = `<b>${msg}</b>`;
    setTimeout(() => { hint.innerHTML = old; }, 1800);
  }

  // ---------------- Member management ----------------
  document.getElementById("addMemberBtn").onclick = addMember;
  document.getElementById("memberName").addEventListener("keydown", (e) => { if (e.key === "Enter") addMember(); });

  function addMember() {
    const nameInput = document.getElementById("memberName");
    const colorInput = document.getElementById("memberColor");
    const name = nameInput.value.trim();
    if (!name) return;
    pushHistory();
    const m = { id: uid(), name, color: colorInput.value };
    state.members.push(m);
    state.selectedMemberId = m.id;
    nameInput.value = "";
    // cycle color a bit for the next add
    save(); renderMemberList(); renderLandList(); draw();
  }

  function renderMemberList() {
    const listEl = document.getElementById("memberList");
    listEl.innerHTML = "";
    state.members.forEach(m => {
      const row = document.createElement("div");
      row.className = "member-row" + (m.id === state.selectedMemberId ? " selected" : "");
      const pos = state.positions[m.id];
      const hasLand = state.lands.some(l => l.memberId === m.id) || Object.values(state.freeformCells).includes(m.id);
      let statusHtml;
      if (!pos) statusHtml = `<span class="status none">未配置</span>`;
      else if (isOutsideOwnLand(m.id)) statusHtml = `<span class="status warn">はみ出し</span>`;
      else if (hasLand) statusHtml = `<span class="status ok">領内</span>`;
      else statusHtml = `<span class="status none">土地未割当</span>`;

      row.innerHTML = `
        <input type="color" class="swatch-input" value="${m.color}" title="タップして色を変更">
        <span class="name">${escapeHtml(m.name)}</span>
        ${statusHtml}
        ${pos ? `<span class="clearpos" title="配置を解除">⌖✕</span>` : ""}
        <span class="rename" title="名前を変更">✎</span>
        <span class="del" data-id="${m.id}" title="削除">✕</span>
      `;
      row.addEventListener("click", (e) => {
        if (e.target.classList.contains("del") || e.target.classList.contains("rename") || e.target.classList.contains("clearpos") || e.target.classList.contains("swatch-input")) return;
        state.selectedMemberId = m.id;
        save(); renderMemberList();
      });
      const colorPicker = row.querySelector(".swatch-input");
      colorPicker.addEventListener("click", (e) => { e.stopPropagation(); });
      let colorHistoryPushed = false;
      colorPicker.addEventListener("input", (e) => {
        if (!colorHistoryPushed) { pushHistory(); colorHistoryPushed = true; }
        m.color = e.target.value;
        draw();
      });
      colorPicker.addEventListener("change", () => {
        colorHistoryPushed = false;
        save(); renderMemberList(); renderLandList();
      });
      row.querySelector(".rename").addEventListener("click", (e) => {
        e.stopPropagation();
        const newName = prompt("新しい名前を入力してください", m.name);
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed) return;
        pushHistory();
        m.name = trimmed;
        save(); renderMemberList(); renderLandList(); draw();
      });
      const clearPosBtn = row.querySelector(".clearpos");
      if (clearPosBtn) {
        clearPosBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          pushHistory();
          delete state.positions[m.id];
          save(); renderMemberList(); draw();
        });
      }
      row.querySelector(".del").addEventListener("click", (e) => {
        e.stopPropagation();
        pushHistory();
        state.members = state.members.filter(x => x.id !== m.id);
        state.lands = state.lands.filter(l => l.memberId !== m.id);
        Object.keys(state.freeformCells).forEach(k => {
          if (state.freeformCells[k] === m.id) delete state.freeformCells[k];
        });
        delete state.positions[m.id];
        if (state.selectedMemberId === m.id) state.selectedMemberId = null;
        save(); renderMemberList(); renderLandList(); draw();
      });
      listEl.appendChild(row);
    });
  }

  document.getElementById("addLandBtn").onclick = () => {
    const memberSel = document.getElementById("landAddMember");
    const memberId = memberSel.value;
    if (!memberId) { flashHint("先にメンバーを追加してください"); return; }

    const xEl1 = document.getElementById("landX1"), yEl1 = document.getElementById("landY1");
    const xEl2 = document.getElementById("landX2"), yEl2 = document.getElementById("landY2");
    const rawX1 = xEl1.value, rawY1 = yEl1.value, rawX2 = xEl2.value, rawY2 = yEl2.value;
    if (rawX1 === "" || rawY1 === "" || rawX2 === "" || rawY2 === "") {
      flashHint("X1・Y1・X2・Y2をすべて入力してください");
      return;
    }
    const nx1 = parseInt(rawX1, 10), ny1 = parseInt(rawY1, 10);
    const nx2 = parseInt(rawX2, 10), ny2 = parseInt(rawY2, 10);
    if ([nx1, ny1, nx2, ny2].some(v => Number.isNaN(v))) {
      flashHint("座標は整数で入力してください");
      return;
    }

    const rx1 = Math.min(nx1, nx2), rx2 = Math.max(nx1, nx2);
    const ry1 = Math.min(ny1, ny2), ry2 = Math.max(ny1, ny2);
    if (rectOverlapsAny(rx1, ry1, rx2, ry2)) {
      flashHint("既存の土地と重なっています");
      return;
    }

    pushHistory();
    const land = { id: uid(), memberId, x1: rx1, x2: rx2, y1: ry1, y2: ry2 };
    state.lands.push(land);
    xEl1.value = ""; yEl1.value = ""; xEl2.value = ""; yEl2.value = "";
    save(); draw(); renderLandList(); renderMemberList();

    // 入力範囲が画面外の場合は見えるように移動
    const cw = canvas.width / dpr, ch = canvas.height / dpr;
    const center = worldToScreen((land.x1 + land.x2 + 1) / 2, (land.y1 + land.y2 + 1) / 2);
    if (center.x < 0 || center.y < 0 || center.x > cw || center.y > ch) {
      view.offsetX += cw / 2 - center.x;
      view.offsetY += ch / 2 - center.y;
      draw();
    }
  };

  function renderLandAddMemberOptions() {
    const sel = document.getElementById("landAddMember");
    const prevValue = sel.value;
    sel.innerHTML = "";
    state.members.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.id; opt.textContent = m.name;
      sel.appendChild(opt);
    });
    if (state.members.some(m => m.id === prevValue)) sel.value = prevValue;
    else if (state.selectedMemberId) sel.value = state.selectedMemberId;
  }

  function renderLandList() {
    renderLandAddMemberOptions();
    const listEl = document.getElementById("landList");
    listEl.innerHTML = "";
    const memberById = {};
    state.members.forEach(m => memberById[m.id] = m);
    state.lands.forEach(l => {
      const m = memberById[l.memberId];
      const row = document.createElement("div");
      row.className = "land-row";
      const label = l.name ? `${escapeHtml(l.name)} ・ ${m ? escapeHtml(m.name) : "?"}` : (m ? escapeHtml(m.name) : "?");
      row.innerHTML = `
        <span class="swatch" style="background:${m ? m.color : '#666'}"></span>
        <span class="coord">${label}: (${l.x1},${l.y1})–(${l.x2},${l.y2})</span>
        <span class="rename" title="名前を変更">✎</span>
        <span class="del" title="削除">✕</span>
      `;
      row.querySelector(".rename").addEventListener("click", () => {
        const newName = prompt("この土地の名前を入力してください（空にすると解除）", l.name || "");
        if (newName === null) return;
        pushHistory();
        l.name = newName.trim();
        save(); renderLandList();
      });
      row.querySelector(".del").addEventListener("click", () => {
        pushHistory();
        state.lands = state.lands.filter(x => x.id !== l.id);
        save(); renderLandList(); renderMemberList(); draw();
      });
      listEl.appendChild(row);
    });
  }

  function centerOnCell(x, y) {
    const cw = canvas.width / dpr, ch = canvas.height / dpr;
    const center = worldToScreen(x + 0.5, y + 0.5);
    view.offsetX += cw / 2 - center.x;
    view.offsetY += ch / 2 - center.y;
    draw();
  }

  function renderMemoList() {
    const listEl = document.getElementById("memoList");
    if (!listEl) return;
    listEl.innerHTML = "";
    const memos = state.memos || [];
    if (memos.length === 0) {
      listEl.innerHTML = '<div style="font-size:11.5px; color:var(--text-dim); padding:2px 2px;">まだメモはありません（<b>メモ</b>モードで地図をタップして追加）</div>';
      return;
    }
    memos.forEach(memo => {
      const row = document.createElement("div");
      row.className = "land-row";
      const preview = memo.text.length > 20 ? memo.text.slice(0, 20) + "…" : memo.text;
      row.innerHTML = `
        <span class="swatch" style="background:#c9a24b"></span>
        <span class="coord" style="cursor:pointer" title="${escapeHtml(memo.text)}">(${memo.x},${memo.y}) ${escapeHtml(preview)}</span>
        <span class="rename" title="編集">✎</span>
        <span class="del" title="削除">✕</span>
      `;
      row.querySelector(".coord").addEventListener("click", () => centerOnCell(memo.x, memo.y));
      row.querySelector(".rename").addEventListener("click", (e) => {
        e.stopPropagation();
        const newText = prompt("メモを編集します（空にしてOKで削除）", memo.text);
        if (newText === null) return;
        const trimmed = newText.trim();
        pushHistory();
        if (!trimmed) {
          state.memos = state.memos.filter(mm => mm.id !== memo.id);
        } else {
          memo.text = trimmed;
        }
        save(); draw(); renderMemoList();
      });
      row.querySelector(".del").addEventListener("click", (e) => {
        e.stopPropagation();
        pushHistory();
        state.memos = state.memos.filter(mm => mm.id !== memo.id);
        save(); draw(); renderMemoList();
      });
      listEl.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------------- Export / Import ----------------
  document.getElementById("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "領地管理データ.json";
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        pushHistory();
        state = Object.assign({ members: [], lands: [], freeformCells: {}, positions: {}, markedCells: {}, memos: [], selectedMemberId: null, snapshots: [] }, parsed);
        save(); renderMemberList(); renderLandList(); renderSnapshotList(); renderMemoList(); draw();
      } catch(err) {
        alert("読み込みに失敗しました。JSON形式を確認してください。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---------------- スナップショット保存 ----------------
  function saveSnapshot() {
    const defaultName = "保存 " + new Date().toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    const name = prompt("スナップショット名を入力してください", defaultName);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    const snap = {
      id: uid(),
      name: trimmed,
      savedAt: new Date().toISOString(),
      data: {
        members: JSON.parse(JSON.stringify(state.members)),
        lands: JSON.parse(JSON.stringify(state.lands)),
        freeformCells: JSON.parse(JSON.stringify(state.freeformCells)),
        positions: JSON.parse(JSON.stringify(state.positions)),
        markedCells: JSON.parse(JSON.stringify(state.markedCells)),
        memos: JSON.parse(JSON.stringify(state.memos || []))
      }
    };
    if (!state.snapshots) state.snapshots = [];
    state.snapshots.push(snap);
    save();
    renderSnapshotList();
  }
  document.getElementById("saveSnapshotBtn").onclick = saveSnapshot;

  function loadSnapshot(id) {
    const snap = (state.snapshots || []).find(s => s.id === id);
    if (!snap) return;
    if (!confirm(`「${snap.name}」を読み込みます。現在編集中の内容は上書きされます。よろしいですか？`)) return;
    pushHistory();
    state.members = JSON.parse(JSON.stringify(snap.data.members));
    state.lands = JSON.parse(JSON.stringify(snap.data.lands));
    state.freeformCells = JSON.parse(JSON.stringify(snap.data.freeformCells));
    state.positions = JSON.parse(JSON.stringify(snap.data.positions));
    state.markedCells = JSON.parse(JSON.stringify(snap.data.markedCells || {}));
    state.memos = JSON.parse(JSON.stringify(snap.data.memos || []));
    state.selectedMemberId = null;
    save(); draw(); renderMemberList(); renderLandList(); renderMemoList();
  }

  function renameSnapshot(id) {
    const snap = (state.snapshots || []).find(s => s.id === id);
    if (!snap) return;
    const name = prompt("新しい名前を入力してください", snap.name);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    snap.name = trimmed;
    save(); renderSnapshotList();
  }

  function deleteSnapshot(id) {
    if (!confirm("このスナップショットを削除しますか？")) return;
    state.snapshots = (state.snapshots || []).filter(s => s.id !== id);
    save(); renderSnapshotList();
  }

  function renderSnapshotList() {
    const listEl = document.getElementById("snapshotList");
    if (!listEl) return;
    listEl.innerHTML = "";
    const snaps = (state.snapshots || []).slice().reverse();
    if (snaps.length === 0) {
      listEl.innerHTML = '<div style="font-size:11.5px; color:var(--text-dim); padding:2px 2px;">まだ保存されたスナップショットはありません</div>';
      return;
    }
    snaps.forEach(snap => {
      const row = document.createElement("div");
      row.className = "snapshot-row";
      const d = new Date(snap.savedAt);
      const dateStr = isNaN(d.getTime()) ? "" : d.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
      row.innerHTML = `
        <div class="info">
          <span class="sname">${escapeHtml(snap.name)}</span>
          <span class="sdate">${dateStr}</span>
        </div>
        <span class="icon load" title="このスナップショットを読み込む">⇩</span>
        <span class="icon rename" title="名前を変更">✎</span>
        <span class="icon del" title="削除">✕</span>
      `;
      row.querySelector(".load").addEventListener("click", () => loadSnapshot(snap.id));
      row.querySelector(".rename").addEventListener("click", () => renameSnapshot(snap.id));
      row.querySelector(".del").addEventListener("click", () => deleteSnapshot(snap.id));
      listEl.appendChild(row);
    });
  }

  // ---------------- GitHub公開用に書き出す ----------------
  // 現在のページ自身(HTML)を複製し、保存済みスナップショット＋現在の内容を初期データとして埋め込んだファイルを作る。
  // サーバーを持たない静的ホスティング(GitHub Pagesなど)でも、埋め込んだスナップショットを選んで閲覧できる。
  document.getElementById("exportGithubBtn").onclick = () => {
    const list = state.snapshots || [];
    if (list.length === 0) {
      if (!confirm("保存済みのスナップショットがまだありません。現在の内容だけを書き出しますか？\n（あとで「名前をつけて保存」をしてから書き出すと、複数のバージョンを選べるようになります）")) return;
    }
    const seed = {
      members: state.members,
      lands: state.lands,
      freeformCells: state.freeformCells,
      positions: state.positions,
      markedCells: state.markedCells,
      memos: state.memos,
      selectedMemberId: null,
      snapshots: list
    };
    const json = JSON.stringify(seed).replace(/<\/script/gi, "<\\/script");

    let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    html = html.replace(
      /(<script id="embedded-state" type="application\/json">)[\s\S]*?(<\/script>)/,
      "$1" + json + "$2"
    );

    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "領地管理マップ_公開用.html";
    a.click();
    URL.revokeObjectURL(url);
  };

  // ---------------- Init ----------------
  (async function init() {
    // GitHub公開用に書き出された場合、ここに埋め込まれたスナップショット/データを初期値として読み込む
    try {
      const seedEl = document.getElementById("embedded-state");
      if (seedEl) {
        const text = seedEl.textContent.trim();
        if (text && text !== "{}") {
          const seed = JSON.parse(text);
          state = Object.assign(state, seed);
        }
      }
    } catch (e) {
      console.error("埋め込みデータの読み込みに失敗しました", e);
    }

    try {
      const loaded = await loadState();
      if (loaded) state = Object.assign(state, loaded);
    } catch (e) {
      console.error("初期読み込みに失敗しました", e);
    }

    renderMemberList();
    renderLandList();
    renderSnapshotList();
    renderMemoList();
    updateHint();
    resizeCanvas();
  })();
})();
</script>
</body>
</html>
